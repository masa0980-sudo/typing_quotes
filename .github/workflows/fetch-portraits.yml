# 肖像画像を Wikimedia Commons から取得して、リポジトリへコミットするワークフロー。
#
# 手元(Claude Code のサンドボックス)からは wikimedia.org へ到達できないため、
# ネットワークのある GitHub Actions 上で取得する。取得結果は成果物として
# コミットするので、通常のビルドは外部ネットワークに一切依存しない。
#
# 人物や OVERRIDE を変えたあと、Actions から手動で実行する。
name: Fetch portraits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp

      - name: Fetch portraits
        run: python3 scripts/fetch-portraits.py
        env:
          PORTRAIT_BUDGET: "1500"

      - name: Show result
        run: |
          ls public/portraits 2>/dev/null | head -3 || true
          echo "枚数: $(ls public/portraits 2>/dev/null | wc -l)"
          echo "合計: $(du -sh public/portraits 2>/dev/null | cut -f1)"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portraits src/lib/portraits.ts
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "肖像画像を Wikimedia Commons から取得(自動生成)"
            git push
          fi
